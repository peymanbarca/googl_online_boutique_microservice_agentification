version: "3.8"
services:



  mongodb:
    image: mongo:latest
    container_name: mongodb_ms_to_mas_google
    ports:
      - "27017:27017"
    # environment:
    #   - MONGO_INITDB_ROOT_USERNAME=user
    #   - MONGO_INITDB_ROOT_PASSWORD=pass1
    volumes:
      - mongodb-data-ms-to-mas-google:/data/db


  redis:
    image: redis
    container_name: redis_ms_to_mas_google
    #restart: always
    ports:
      - '6385:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass 1
    volumes:
      - redis-cache-local-ms-to-mas-google:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_ms_to_mas_google
    ports:
      - "5672:5672"  # RabbitMQ broker port
      - "15672:15672"  # RabbitMQ management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data-ms-to-mas-google:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s



volumes:
  redis-cache-local-ms-to-mas-google:
  rabbitmq-data-ms-to-mas-google:
  mongodb-data-ms-to-mas-google:
